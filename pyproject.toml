[project]
name = "jtrainer"
version = "0.1.0"
description = "A terminal trainer for Jeopardy! preparation: real archive clues, grading, logging, adaptive study."
authors = [
    { name = "Noah Case", email = "noahcase119@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "duckdb>=2.0.1",
    "fsrs>=6.3.3",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
    "selectolax>=1.0.2",
    "textual>=8.2.8",
]

[project.scripts]
jtrain = "jtrainer.cli:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-textual-snapshot>=1.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not live' --strict-markers"
markers = [
    "slow: simulation-recovery tests, full games, large fixtures (run with -m slow)",
    "live: real Anthropic API calls; needs ANTHROPIC_API_KEY (run with -m live)",
    "snapshot: TUI snapshot comparisons",
]

[tool.coverage.run]
branch = true
source = ["jtrainer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "SIM108", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
